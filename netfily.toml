# ============================================================
# NETLIFY CONFIGURATION FOR PET-GOTOPRO
# ============================================================
# Build settings, headers for admin assets, redirects, and
# functions configuration for the AI SEO endpoint.
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# ============================================================
# FUNCTIONS — Serverless functions for AI SEO and future features
# ============================================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ============================================================
# HEADERS — Tell browsers how to handle specific files
# ============================================================

# Serve admin config.yml as plain text (not as a download)
[[headers]]
  for = "/admin/config.yml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Make sure admin/index.html is served as HTML
[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Same for the /admin/ URL (with trailing slash)
[[headers]]
  for = "/admin/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# ============================================================
# REDIRECTS
# ============================================================

# Make sure /admin works without trailing slash
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Clean URL for the SEO helper function
[[redirects]]
  from = "/api/seo-suggest"
  to = "/.netlify/functions/seo-suggest"
  status = 200
  force = true

# ============================================================
# CACHING — Prevent caching of the admin so updates appear instantly
# ============================================================

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
